[project]
name = "meds-task-selection"
version = "0.1.0"
description = "Select fine-tuning/evaluation tasks for MEDS models from measured dense-grid prevalence"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
meds-ts-count-codes = "meds_task_selection.compute_code_counts:main"
meds-ts-candidates = "meds_task_selection.select_candidates:main"
meds-ts-prevalence = "meds_task_selection.measure_prevalence:main"
meds-ts-select = "meds_task_selection.select_tasks:main"
meds-ts-labels = "meds_task_selection.extract_labels:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meds_task_selection"]
